name: icon-automation
on:
  workflow_dispatch:
  push:
    branches:
      - master
    # file paths to consider in the event. Optional; defaults to all.
    paths:
      - package.json

jobs:
  icon_automation:
    if: github.event_name == 'push'
    name: figma icon automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v1

      - uses: actions/setup-node@v1
        with:
          node-version: "20.x"
          
      
      - name: Install dependencies
        run: yarn install
      
      - name: Figma Action
        uses: primer/figma-action@v1.0.0-alpha.2
        with:
          args: "format=svg outputDir=./src/"
        env:
          FIGMA_FILE_URL: ${{ secrets.FIGMA_FILE_URL }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
          
      - name: Build
        run: |
          yarn generate
          yarn build:bundle
      
      - name: Publish
        uses: zmicro-design/action-npm-publish@v1
        with:
          registry: https://registry.npmjs.org
          token: ${{ secrets.NPM_AUTH_TOKEN }}
          
      - run: yarn build
      - name: GitHub Pages
        uses: crazy-max/ghaction-github-pages@v1.2.5
        with:
          build_dir: docs
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

  package_artifact:
    name: Build package for GitLab
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.x"
      - name: Install dependencies
        run: yarn install
      - name: Export Figma SVG
        uses: primer/figma-action@v1.0.0-alpha.2
        with:
          args: "format=svg outputDir=./src/"
        env:
          FIGMA_FILE_URL: ${{ secrets.FIGMA_FILE_URL }}
          FIGMA_TOKEN: ${{ secrets.FIGMA_TOKEN }}
      - name: Build
        run: |
          yarn generate
          yarn build:bundle
      - name: Pack and record source
        run: |
          mkdir -p artifact
          npm pack --pack-destination artifact
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const pkg = require('./package.json');
          const files = fs.readdirSync('artifact').filter(f => f.endsWith('.tgz'));
          if (files.length !== 1) throw new Error('Expected one package');
          const file = files[0];
          fs.writeFileSync('artifact/manifest.json', JSON.stringify({
            repository: process.env.GITHUB_REPOSITORY,
            commit: process.env.GITHUB_SHA,
            runId: process.env.GITHUB_RUN_ID,
            name: pkg.name, version: pkg.version, file,
            sha512: crypto.createHash('sha512').update(fs.readFileSync('artifact/' + file)).digest('hex')
          }, null, 2));
          NODE
      - name: Upload package for GitLab
        uses: actions/upload-artifact@v4
        with:
          name: tant-icons-package-${{ github.sha }}
          path: artifact/
          if-no-files-found: error
          retention-days: 30
